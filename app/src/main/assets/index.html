<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Jewish Family Budget</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#24344d}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{height:58px;background:#fff;border-bottom:1px solid #dde5ef;display:flex;align-items:center;padding:0 14px;gap:10px;position:sticky;top:0;z-index:20}.menu{display:none;border:0;background:#edf2f8;border-radius:10px;padding:9px 12px}.brand{font-weight:800;color:#244b78}.lang{margin-left:auto;border:1px solid #d7e0ea;border-radius:10px;padding:8px;background:#fff}.side{position:fixed;top:58px;bottom:0;left:0;width:245px;background:#274a76;color:#fff;padding:15px;overflow:auto}.side button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#eaf2fc;padding:11px;border-radius:10px;margin:3px 0}.side button.active,.side button:hover{background:#fff;color:#274a76}.main{margin-left:245px;padding:18px;max-width:1300px}.hero{background:linear-gradient(135deg,#e9f2fb,#fff9ed);border:1px solid #dbe5ef;border-radius:22px;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:15px}.hero h1{margin:0 0 7px;font-size:29px}.hero p{margin:0;color:#617086}.heroicon{font-size:70px}.page{display:none}.page.active{display:block}.sectionTitle{margin:22px 0 12px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid #dde5ef;border-radius:16px;padding:16px;box-shadow:0 4px 15px #24344d0b}.cat{min-height:120px;text-align:left;border:1px solid #dde5ef;background:#fff;border-radius:16px;padding:16px}.cat .ico{font-size:30px}.cat b{display:block;margin:7px 0 3px}.cat span,.muted{color:#718096;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d7e0ea;border-radius:10px;background:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;padding:10px 13px;background:#eaf1f8;color:#274a76;font-weight:700}.primary{background:#274a76;color:#fff}.danger{background:#fee2e2;color:#991b1b}.total{font-size:25px;font-weight:800;margin-top:6px}.list{display:grid;gap:8px;margin-top:10px}.item{display:grid;grid-template-columns:1fr 110px 100px auto;gap:7px;align-items:center}.item input,.item select{padding:9px;border:1px solid #d7e0ea;border-radius:9px}.note{font-size:12px;color:#718096}.tool{margin-top:12px}.hidden{display:none}.rtl{direction:rtl;text-align:right}@media(max-width:760px){.menu{display:block}.side{transform:translateX(-110%);transition:.2s;z-index:30;width:280px}.side.open{transform:translateX(0)}.main{margin:0;padding:12px}.hero{padding:17px}.hero h1{font-size:23px}.heroicon{font-size:52px}.grid{grid-template-columns:1fr}.item{grid-template-columns:1fr 1fr}.item .wide{grid-column:1/-1}.cards{grid-template-columns:1fr 1fr}.top{height:54px}.side{top:54px}}@media(max-width:390px){.cards{grid-template-columns:1fr}}
</style></head>
<body><div class="app"><header class="top"><button class="menu" id="menuBtn">☰</button><div class="brand">🕎 Jewish Family Budget</div><select id="language" class="lang"><option value="en">English</option><option value="yi">יידיש</option></select></header>
<aside class="side" id="side"></aside><main class="main"><section class="hero"><div><h1 id="title">Jewish Family Budget</h1><p id="subtitle">Private • Fully Offline • Everything is optional</p></div><div class="heroicon">🕎</div></section><div id="content"></div></main></div>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id),KEY="jfb_try3";
let d;try{d=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){d=null}
if(!d)d={income:0,rent:0,weekly:0,pocket:0,bank:0,savings:0,investments:0,creditDebt:0,maaserRate:10,bills:[],yomtov:[],simchas:[],school:0,community:0};
const nav=[
["dashboard","🏠","Dashboard"],["household","🏡","Household & Housing"],["bills","🧾","Monthly Bills"],["groceries","🛒","Weekly Groceries"],["yomtov","🕯️","Yom Tovim"],["simchas","💍","Simchas"],["school","🎓","School & Camp"],["community","❤️","Community & Tzedakah"],["cash","💵","Pocket Cash"],["assets","🏦","Bank & Investments"],["credit","💳","Credit Cards"],["tools","🧮","Financial Tools"],["reports","📊","Reports"]];
let current="dashboard";
const tx={en:{subtitle:"Private • Fully Offline • Everything is optional"},yi:{subtitle:"פּריוואַט • גאָר אָפליין • אַלץ איז אָפּציאָנאַל"}};
function money(n){return "$"+(Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function save(){localStorage.setItem(KEY,JSON.stringify(d));render();renderSide();document.querySelectorAll("input[data-save]").forEach(x=>x.blur())}
function renderSide(){const s=$("side");s.innerHTML=nav.map(x=>'<button data-page="'+x[0]+'">'+x[1]+" "+x[2]+"</button>").join("");s.querySelectorAll("button").forEach(b=>b.onclick=()=>{current=b.dataset.page;render();renderSide();if(innerWidth<761)s.classList.remove("open")});s.querySelector('[data-page="'+current+'"]')?.classList.add("active")}
function field(label,key,type="number"){return '<div class="field"><label>'+label+'</label><input data-save="'+key+'" type="'+type+'" value="'+String(d[key]??"")+'" placeholder="Optional"></div>'}
function bind(){document.querySelectorAll("[data-save]").forEach(el=>el.oninput=()=>{d[el.dataset.save]=el.type==="number"?Number(el.value)||0:el.value;localStorage.setItem(KEY,JSON.stringify(d));calc()});document.querySelectorAll("input,select,textarea").forEach(el=>{el.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();let a=[...document.querySelectorAll("input,select,textarea")],i=a.indexOf(el);if(a[i+1])a[i+1].focus()}}})}
function calc(){const bill=d.bills.reduce((s,x)=>s+(+x.amount||0),0),assets=(+d.bank||0)+(+d.savings||0)+(+d.investments||0)+(+d.pocket||0),debt=(+d.creditDebt||0),maaser=(+d.income||0)*(+d.maaserRate||10)/100;document.querySelectorAll("[data-calc=bills]").forEach(x=>x.textContent=money(bill));document.querySelectorAll("[data-calc=assets]").forEach(x=>x.textContent=money(assets));document.querySelectorAll("[data-calc=debt]").forEach(x=>x.textContent=money(debt));document.querySelectorAll("[data-calc=maaser]").forEach(x=>x.textContent=money(maaser))}
function page(title,body){return '<h2 class="sectionTitle">'+title+'</h2>'+body}
function render(){
const c=$("content");let h="";
if(current==="dashboard")h='<div class="cards">'+nav.slice(1).map(x=>'<button class="cat" data-page="'+x[0]+'"><span class="ico">'+x[1]+'</span><b>'+x[2]+'</b><span>Tap to enter information</span></button>').join("")+'</div><div class="card" style="margin-top:12px"><b>How it works</b><p class="muted">1. Choose a category. 2. Enter what you know. 3. Empty fields are okay. 4. Your data stays on this device. 5. Use Reports for totals.</p></div>';
else if(current==="household")h=page("Household & Housing",'<div class="grid">'+field("Monthly income","income")+field("Monthly rent","rent")+'</div><div class="card" style="margin-top:12px"><b>Maaser / Tzedakah</b><div class="grid">'+field("Income used for calculation","income")+'<div class="field"><label>Maaser rate %</label><input data-save="maaserRate" type="number" value="'+d.maaserRate+'"></div></div><div class="total" data-calc="maaser">'+money(d.income*d.maaserRate/100)+'</div><div class="note">Default is 10%. This is a budgeting calculator, not a halachic ruling.</div></div>';
else if(current==="bills")h=page("Monthly Bills",'<div class="actions"><button class="btn primary" id="addBill">＋ Add Bill</button></div><div class="list" id="billList"></div><div class="card"><b>Total bills</b><div class="total" data-calc="bills">$0.00</div></div>');
else if(current==="groceries")h=page("Weekly Groceries",'<div class="grid">'+field("Weekly grocery order","weekly")+'</div><div class="card tool"><b>Estimated monthly</b><div class="total">'+money(d.weekly*4.333)+'</div><div class="note">Approximation: 52 weeks ÷ 12 months.</div></div>');
else if(current==="yomtov")h=page("Yom Tovim",'<div class="grid">'+["Rosh Hashanah","Yom Kippur","Sukkos","Simchas Torah","Chanukah","Purim","Pesach","Shavuos"].map(n=>'<div class="card"><b>🕯️ '+n+'</b><div class="field" style="margin-top:8px"><label>Food</label><input class="yt" data-name="'+n+'" data-part="food" type="number" placeholder="Optional"></div><div class="field" style="margin-top:8px"><label>Other</label><input class="yt" data-name="'+n+'" data-part="other" type="number" placeholder="Optional"></div></div>').join("")+'</div>');
else if(current==="simchas")h=page("Simchas",'<div class="card"><b>Simchah planning</b><p class="muted">Create a simple budget for a wedding, Bar Mitzvah, Bris, Sheva Brachos, or another Simchah.</p><div class="grid"><div class="field"><label>Name</label><input id="simName" placeholder="Optional"></div><div class="field"><label>Estimated total</label><input id="simAmount" type="number" placeholder="Optional"></div></div><button class="btn primary" id="addSim">＋ Add Simchah</button><div class="list" id="simList"></div></div>');
else if(current==="school")h=page("School & Camp",'<div class="grid">'+field("School / tuition","school")+'<div class="field"><label>Camp / other</label><input data-save="school" type="number" value="'+d.school+'"></div></div>');
else if(current==="community")h=page("Community & Tzedakah",'<div class="grid">'+field("Tzedakah / community","community")+'</div>');
else if(current==="cash")h=page("Pocket Cash",'<div class="grid">'+field("Cash currently in pocket","pocket")+'</div><div class="note">Separate from your bank account. Use for small purchases, groceries, tips, and giving a dollar here and there.</div>');
else if(current==="assets")h=page("Bank & Investments",'<div class="grid">'+field("Checking / bank","bank")+field("Savings","savings")+field("Investments / S&P / stocks","investments")+'</div><div class="card"><b>Total assets tracked</b><div class="total" data-calc="assets">'+money(d.bank+d.savings+d.investments+d.pocket)+'</div></div>');
else if(current==="credit")h=page("Credit Cards",'<div class="grid">'+field("Total credit-card balance","creditDebt")+'</div><div class="note">You can enter your combined balance here. Keep individual card details in your own records if desired.</div>');
else if(current==="tools")h=page("Financial Tools",'<div class="card tool"><b>Investment Growth Calculator</b><div class="grid"><div class="field"><label>Starting amount</label><input id="start" type="number" value="1000"></div><div class="field"><label>Monthly contribution</label><input id="contrib" type="number" value="0"></div><div class="field"><label>Years</label><input id="years" type="number" value="30"></div><div class="field"><label>Estimated annual return %</label><input id="rate" type="number" value="7"></div></div><button class="btn primary" id="grow">Calculate</button><div class="total" id="growResult">$0.00</div><div class="note">Hypothetical estimate, not a guarantee.</div></div><div class="card tool"><b>Emergency Fund</b><div class="grid"><div class="field"><label>Monthly essential expenses</label><input id="ess" type="number"></div><div class="field"><label>Months</label><input id="months" type="number" value="3"></div></div><div class="total" id="emergency">$0.00</div></div>');
else if(current==="reports")h=page("Reports & Results",'<div class="cards"><div class="card"><b>Monthly Bills</b><div class="total" data-calc="bills">$0.00</div></div><div class="card"><b>Assets</b><div class="total" data-calc="assets">$0.00</div></div><div class="card"><b>Credit Debt</b><div class="total" data-calc="debt">$0.00</div></div><div class="card"><b>Maaser</b><div class="total" data-calc="maaser">$0.00</div></div></div><div class="actions"><button class="btn" id="export">Export Backup</button><button class="btn danger" id="reset">Clear Local Data</button></div>');
c.innerHTML=h;bind();calc();wirePage()
}
function renderBills(){const box=$("billList");if(!box)return;box.innerHTML=d.bills.map((x,i)=>'<div class="item"><input class="wide" value="'+(x.name||"")+'" placeholder="Bill name"><input type="number" value="'+(x.amount||"")+'" placeholder="Amount"><input type="date" value="'+(x.due||"")+'"><select><option '+(!x.paid?"selected":"")+' value="0">Unpaid</option><option '+(x.paid?"selected":"")+' value="1">Paid</option></select><button class="btn danger">×</button></div>').join("");[...box.children].forEach((r,i)=>{const q=r.querySelectorAll("input,select");q[0].oninput=()=>{d.bills[i].name=q[0].value;save()};q[1].oninput=()=>{d.bills[i].amount=+q[1].value||0;save()};q[2].oninput=()=>{d.bills[i].due=q[2].value;save()};q[3].onchange=()=>{d.bills[i].paid=q[3].value==="1";save()};r.querySelector("button").onclick=()=>{d.bills.splice(i,1);save();render()}})}
function wirePage(){
$("menuBtn").onclick=()=>$("side").classList.toggle("open");
$("addBill")?.addEventListener("click",()=>{d.bills.push({name:"",amount:0,due:"",paid:false});save();render()});
$("addSim")?.addEventListener("click",()=>{const n=$("simName").value||"Simchah",a=+$("simAmount").value||0;d.simchas.push({name:n,amount:a});save();render()});
document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{current=b.dataset.page;render();renderSide()});
document.querySelectorAll(".yt").forEach(el=>el.oninput=()=>{d.yomtov=d.yomtov||[];const x=d.yomtov.find(z=>z.name===el.dataset.name)||{name:el.dataset.name,food:0,other:0};x[el.dataset.part]=+el.value||0;if(!d.yomtov.includes(x))d.yomtov.push(x);save()});
$("grow")?.addEventListener("click",()=>{let p=+$("start").value||0,m=+$("contrib").value||0,y=+$("years").value||0,r=(+$("rate").value||0)/100/12,n=y*12,v=r? p*Math.pow(1+r,n)+m*((Math.pow(1+r,n)-1)/r):p+m*n;$("growResult").textContent=money(v)});
$("ess")?.addEventListener("input",()=>{$("emergency").textContent=money((+$("ess").value||0)*(+$("months").value||0))});$("months")?.addEventListener("input",()=>{$("emergency").textContent=money((+$("ess").value||0)*(+$("months").value||0))});
$("export")?.addEventListener("click",()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}));a.download="jewish-family-budget-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)});
$("reset")?.addEventListener("click",()=>{if(confirm("Clear all saved budget data on this device?")){localStorage.removeItem(KEY);location.reload()}});
renderBills();const sl=$("simList");if(sl)sl.innerHTML=d.simchas.map(x=>'<div class="card"><b>'+x.name+'</b><div class="total">'+money(x.amount)+'</div></div>').join("");
}
$("language").onchange=()=>{$("subtitle").textContent=tx[$("language").value].subtitle;if($("language").value==="yi")document.documentElement.dir="rtl";else document.documentElement.dir="ltr"};
renderSide();render();
})();
</script></body></html>
