name: Build Jewish Family Budget
on:
  workflow_dispatch:
  push:
    paths: ['app/**','build.gradle','settings.gradle','gradle.properties','.github/workflows/build-apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle --no-daemon --stacktrace assembleDebug bundleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jewish-family-budget-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jewish-family-budget-aab
          path: app/build/outputs/bundle/debug/app-debug.aab
