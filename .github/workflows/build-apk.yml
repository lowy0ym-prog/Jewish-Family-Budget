name: Build Jewish Family Budget APK
on:
  workflow_dispatch:
  push:
    paths: ['app/**','build.gradle','settings.gradle','.github/workflows/build-apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK and AAB
        run: gradle --no-daemon assembleRelease bundleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jewish-family-budget-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: jewish-family-budget-aab
          path: app/build/outputs/bundle/release/app-release.aab
